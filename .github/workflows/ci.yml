name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check catalog and version sync
        run: python3 scripts/check_catalog.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run script unit tests
        run: python3 -m unittest discover -s tests -v

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-path .git
            --exclude-mail
            README.md
            AGENTS.md
            CONTRIBUTING.md
            CHANGELOG.md
            commands
            skills
            rules
          fail: true
