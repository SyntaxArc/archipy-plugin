lifecycle:
  preStop:
    exec:
      command: ["sleep", "5"]

startupProbe:
  grpc:
    port: 50051
    service: liveness
  failureThreshold: 20
  periodSeconds: 5
  timeoutSeconds: 3

livenessProbe:
  grpc:
    port: 50051
    service: liveness
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 3

readinessProbe:
  grpc:
    port: 50051
    service: readiness
  periodSeconds: 5
  failureThreshold: 3
  successThreshold: 2
  timeoutSeconds: 3
