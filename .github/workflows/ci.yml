name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog and version sync
        run: python3 scripts/check_catalog.py
