name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check catalog and version sync
        run: python3 scripts/check_catalog.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run script unit tests
        run: python3 -m unittest discover -s tests -v

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # Config lives in lychee.toml (include_mail, exclude_path, accept).
          args: >-
            --verbose
            --no-progress
            --config lychee.toml
            README.md
            AGENTS.md
            CONTRIBUTING.md
            CHANGELOG.md
            commands
            skills
            rules
          fail: true
